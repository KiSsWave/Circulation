<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>COVID, Vélos, Pollution</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link rel="stylesheet" href="styles.css">        
</head>
<body>
    <h1>COVID, Vélos et Pollution</h1>
    <div id="map"></div>
    <div class="pollution-info" id="pollutionInfo">
        <strong>Qualité de l'air : </strong> Chargement...
    </div>
    <div class="weather-info" id="weatherInfo">
        <strong>Météo : </strong> Chargement...
    </div>
    <div class="file-input">
        <label for="csvFile">Importer un fichier CSV pour les données COVID :</label>
        <input type="file" id="csvFile" accept=".csv">
    </div>
    <div class="chart-container">
        <canvas id="covidChart"></canvas>
    </div>
    <div class="resources">
        <h3>Ressources Utiles</h3>
        <ul>
            <li>GitHub : 
                <a target="_blank" href="https://github.com/KiSsWave/Circulation">Projet GitHub</a>
            </li>
            <li>API Météo : 
                <a target="_blank" href="https://www.infoclimat.fr/public-api/gfs/xml?_ll={$latitude},{$longitude}&_auth=...">Infoclimat</a>
            </li>
            <li>API Géolocalisation : 
                <a target="_blank" href="http://ip-api.com/json/{$userIp}">IP API</a>
            </li>
            <li>API Vélos : 
                <a target="_blank" href="https://api.cyclocity.fr/contracts/nancy/gbfs/station_information.json">Vélos Disponibles</a>
            </li>
            <li>API Pollution : 
                <a target="_blank" href="https://api.waqi.info/feed/here/?token=6b2bcfeae5cf939d58d60c5e4617879531a8e65d">WAQI API</a>
            </li>
        </ul>
    </div>
    

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/papaparse@5.3.2/papaparse.min.js"></script>
    <script src="script.js"></script>
    <script>
        
    </script>
</body>
</html>
